<!doctype html>
<!-- Ikon aplikasi (apple-touch-icon, manifest). Dirender ke PNG oleh readme.shots.ts (?s=…&pad=…). -->
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>blackchat icon</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
      <rect width="32" height="32" fill="#000" />
      <g id="mark" fill="#fff">
        <path
          fill-rule="evenodd"
          d="M2 7h18v2h2v2h4v12H12l-5 5v-5H2z M6 13h12v2.5H6z M6 17.5h7v2.5H6z"
        />
        <rect x="22" y="7" width="2" height="2" opacity=".85" />
        <rect x="26" y="6" width="2" height="2" opacity=".6" />
        <rect x="24" y="3" width="2" height="2" opacity=".45" />
        <rect x="28.5" y="2" width="1.5" height="1.5" opacity=".3" />
      </g>
    </svg>
    <script>
      const params = new URLSearchParams(location.search);
      const size = Number(params.get('s') ?? 512);
      // Porsi kanvas untuk mark (maskable butuh zona aman ~60%).
      const scale = Number(params.get('pad') ?? 0.72);
      const icon = document.getElementById('icon');
      icon.setAttribute('width', size);
      icon.setAttribute('height', size);
      const offset = (32 - 32 * scale) / 2;
      document
        .getElementById('mark')
        .setAttribute(
          'transform',
          `translate(${offset + 1.2 * scale} ${offset + 0.6 * scale}) scale(${scale})`,
        );
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
