name: deploy-relay

# Deploy relay Cloudflare setiap main berubah di bagian relay/protokol (PRD §11.3).
# Dilewati dengan rapi selama secret Cloudflare belum diisi (lihat README, bagian Deploy).
on:
  push:
    branches: [main]
    paths:
      - apps/relay/**
      - packages/protocol/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-relay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Cek secret Cloudflare
        id: config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum diisi; deploy relay dilewati."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.config.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Pastikan konfigurasi produksi sudah diisi
        if: steps.config.outputs.ready == 'true'
        run: |
          if grep -q 'ISI_SETELAH_wrangler_d1_create' apps/relay/wrangler.toml; then
            echo "::error::database_id D1 belum diisi di apps/relay/wrangler.toml (wrangler d1 create blackchat)."
            exit 1
          fi
      - name: Test relay
        if: steps.config.outputs.ready == 'true'
        run: pnpm test:relay
      - name: Migrasi D1 produksi
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/relay
        run: pnpm exec wrangler d1 migrations apply DB --remote --env=""
      - name: Deploy Worker
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/relay
        run: pnpm exec wrangler deploy --env=""
