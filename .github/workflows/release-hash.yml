name: release-hash

# Hash SHA-384 seluruh file web hasil build untuk setiap rilis (PRD §11.3), supaya siapa pun bisa memeriksa
# bahwa yang disajikan di produksi sama dengan kode di tag ini (lihat SECURITY.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web (sama dengan produksi)
        env:
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
        run: |
          if [ -z "$VITE_RELAY_URL" ]; then echo "::error::Repository variable VITE_RELAY_URL belum diisi."; exit 1; fi
          pnpm --filter @blackchat/web build
      - name: Hitung SHA-384
        working-directory: apps/web/dist
        run: |
          find . -type f | sort | while read -r f; do
            printf 'sha384-%s  %s\n' "$(openssl dgst -sha384 -binary "$f" | openssl base64 -A)" "${f#./}"
          done > "$GITHUB_WORKSPACE/hashes.txt"
          cat "$GITHUB_WORKSPACE/hashes.txt"
      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" hashes.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Hash SHA-384 seluruh file web (apps/web/dist) untuk tag ini. Cara memeriksa: lihat SECURITY.md."
